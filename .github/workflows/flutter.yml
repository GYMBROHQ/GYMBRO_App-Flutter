name: Flutter quality

on:
  push:
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.metadata'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.metadata'
      - '.github/workflows/flutter.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
          cache: true

      - name: Resolve dependencies without changing the lockfile
        run: |
          before="$(sha256sum pubspec.lock | cut -d ' ' -f1)"
          flutter pub get --enforce-lockfile
          after="$(sha256sum pubspec.lock | cut -d ' ' -f1)"
          test "$before" = "$after"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check formatting for changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          changed_file_list="$(mktemp)"
          trap 'rm -f "$changed_file_list"' EXIT

          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD^)"
            else
              base_sha=""
            fi
          fi

          if ! git cat-file -e "$GITHUB_SHA^{commit}"; then
            echo "GitHub SHA is not available: $GITHUB_SHA" >&2
            exit 1
          fi

          if [[ -n "$base_sha" ]]; then
            if ! git cat-file -e "$base_sha^{commit}"; then
              echo "Base SHA is not available: $base_sha" >&2
              exit 1
            fi
            if ! git diff --diff-filter=ACMR --name-only "$base_sha" "$GITHUB_SHA" -- '*.dart' >"$changed_file_list"; then
              echo "Unable to discover changed Dart files" >&2
              exit 1
            fi
          elif ! git diff-tree --root --no-commit-id --diff-filter=ACMR --name-only -r "$GITHUB_SHA" -- '*.dart' >"$changed_file_list"; then
            echo "Unable to discover Dart files in the initial commit" >&2
            exit 1
          fi

          mapfile -t dart_files <"$changed_file_list"
          if ((${#dart_files[@]} > 0)); then
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi
