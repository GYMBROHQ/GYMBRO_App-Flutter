name: gymbro
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  qr_flutter: ^4.1.0
  # Auth integration dependencies
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  screen_state: ^2.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  geolocator: ^13.0.1
  intl: ^0.19.0
  # Subscription and payment integration
  flutter_stripe: ^11.2.0
  # App preferences persistence
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
